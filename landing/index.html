<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b3c5d">
<title>CatchTrace - Landing site</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f5f7;color:#16212b;padding-bottom:72px}
header{background:#0b3c5d;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header .t{font-weight:700;font-size:17px}
header .o{font-size:12px;opacity:.85}
.pill{font-size:12px;font-weight:700;padding:5px 9px;border-radius:12px;background:#1f7a4d;color:#fff;white-space:nowrap}
.pill.off{background:#8a5a00}
.pill.warn{background:#a32626}
main{padding:12px;max-width:640px;margin:0 auto}
h2{font-size:18px;margin:6px 0 10px}
h3{font-size:15px;margin:14px 0 6px}
.card{background:#fff;border:1px solid #d7dde3;border-radius:8px;padding:12px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.muted{color:#5b6875;font-size:13px}
.ref{font-family:ui-monospace,Consolas,monospace;font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 10px;border:1px solid #9aa7b3;border-radius:6px;background:#fff;color:inherit;min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid #0b6fb8;outline-offset:0}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:12px 14px;min-height:46px;background:#0b6fb8;color:#fff;cursor:pointer}
button.big{width:100%;font-size:17px;padding:14px}
button.sec{background:#fff;color:#0b3c5d;border:1px solid #0b3c5d}
button.danger{background:#fff;color:#a32626;border:1px solid #a32626}
button.small{min-height:38px;padding:8px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:#e3e8ed;color:#33414d;vertical-align:middle}
.badge.wait{background:#fff0cc;color:#6b4a00}
.badge.bad{background:#fbdada;color:#7c1515}
.badge.ok{background:#d6f0e0;color:#14532d}
.msg{padding:10px 12px;border-radius:6px;margin:0 0 10px;font-size:14px}
.msg.err{background:#fbdada;color:#7c1515}
.msg.info{background:#e3eef8;color:#0b3c5d}
.msg.ok{background:#d6f0e0;color:#14532d}
.pick{border:1px solid #d7dde3;border-radius:6px;margin-top:6px;background:#fff}
.pick button{display:block;width:100%;text-align:left;background:#fff;color:inherit;font-weight:400;border-radius:0;border-bottom:1px solid #e6eaee}
.pick button:last-child{border-bottom:0}
.line{border:1px solid #c5ced6;border-radius:8px;padding:10px;margin:0 0 10px;background:#fafbfc}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #c5ced6;display:flex;z-index:5}
nav button{flex:1;background:#fff;color:#33414d;border-radius:0;font-size:13px;padding:10px 4px;min-height:58px}
nav button.on{color:#0b3c5d;box-shadow:inset 0 3px 0 #0b3c5d}
.hide{display:none}
</style>

};
document.addEventListener('click', function (e) { var el = e.target.closest('[data-act]'); if (!el) return; var a = ACT[el.getAttribute('data-act')]; if (a) { e.preventDefault(); a(el); } });
document.addEventListener('submit', function (e) { var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.getAttribute('data-form')](f); });
document.addEventListener('input', function (e) {
  if (e.target.id === 'fisher-q') paintFisherResults();
  if (e.target.closest('#lines')) paintTotal();
});
document.addEventListener('change', function (e) {
  if (e.target.classList.contains('l-buyer')) $('.l-pricewrap', e.target.closest('.line')).className = 'l-pricewrap' + (e.target.value ? '' : ' hide');
  if (e.target.getAttribute('data-change') === 'org') { S.org = e.target.value; DB.put('kv', S.org, ukey('org')).then(loadCache).then(function () { render(); if (navigator.onLine) refreshReg().then(render, function () {}); }); }
  if (e.target.closest('#lines')) paintTotal();
});
window.addEventListener('online', function () { S.online = true; paintStatus(); sync(); });
window.addEventListener('offline', function () { S.online = false; paintStatus(); });
setInterval(function () { if (S.session && navigator.onLine && pendingCount() && !S.needLogin) sync(); }, 30000);

// -------------------------------------------------------------------- boot
function loadConfig() {
  return fetch('config.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (c) { localStorage.setItem('ct.cfg', JSON.stringify(c)); return c; },
    function () { var c = localStorage.getItem('ct.cfg'); if (c) return JSON.parse(c); throw new Error('config'); });
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* app still works online */ });
loadConfig().then(function (c) {
  S.cfg = c;
  try { S.session = JSON.parse(localStorage.getItem('ct.session') || 'null'); } catch (e) { S.session = null; }
  if (!S.session) return render();
  return loadCache().then(function () {
    render();
    if (navigator.onLine) return refreshAll().then(function () { return loadCache(); }).then(function () { softRender(); return sync(); }, function (e) { if (e instanceof AuthErr) { S.needLogin = true; render(); } });
  });
}).catch(function () { $('#view').innerHTML = '<div class="msg err">The app could not start. Connect to the internet and open it again.</div>'; });
window.__ct = { S: S, sync: sync };   // read-only handle used by the automated tests
})();
</script>
</body>
</html>
