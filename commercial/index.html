<!doctype html>
<html lang="en">
<head>

<title>CatchTrace - Buying and processing</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f5f7;color:#16212b;padding-bottom:40px}
header{background:#0b3c5d;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header .t{font-weight:700;font-size:17px}
header .o{font-size:12px;opacity:.85}
header button{background:transparent;border:1px solid #fff;color:#fff;min-height:36px;padding:6px 10px;font-size:13px}
main{padding:12px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:6px 0 10px}
h3{font-size:15px;margin:14px 0 6px}
.card{background:#fff;border:1px solid #d7dde3;border-radius:8px;padding:12px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.muted{color:#5b6875;font-size:13px}
.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.ref{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.big-num{font-size:20px;font-weight:700}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 10px;border:1px solid #9aa7b3;border-radius:6px;background:#fff;color:inherit;min-height:46px}
input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;flex:none}
input:focus,select:focus,textarea:focus{outline:2px solid #0b6fb8;outline-offset:0}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:12px 14px;min-height:46px;background:#0b6fb8;color:#fff;cursor:pointer}
button.big{width:100%;font-size:17px;padding:14px}
button.sec{background:#fff;color:#0b3c5d;border:1px solid #0b3c5d}
button.danger{background:#fff;color:#a32626;border:1px solid #a32626}
button.small{min-height:38px;padding:8px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:#e3e8ed;color:#33414d;vertical-align:middle;margin-right:4px}
.badge.wait{background:#fff0cc;color:#6b4a00}
.badge.ok{background:#d6f0e0;color:#14532d}
.msg{padding:10px 12px;border-radius:6px;margin:0 0 10px;font-size:14px}
.msg.err{background:#fbdada;color:#7c1515}
.msg.info{background:#e3eef8;color:#0b3c5d}
.msg.ok{background:#d6f0e0;color:#14532d}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;background:#fff;color:#33414d;border:1px solid #c5ced6}
.tabs button.on{background:#0b3c5d;color:#fff;border-color:#0b3c5d}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{flex:1}
.pickrow{display:flex;gap:10px;align-items:center}
.list div.item{border-top:1px solid #e6eaee;padding:8px 0;font-size:14px;overflow-wrap:anywhere}
.list div.item:first-child{border-top:0}
.qrbox{border:1px solid #c5ced6;border-radius:8px;padding:12px;margin:10px 0;background:#fff;text-align:center}
.qrbox svg{width:200px;height:200px;display:block;margin:0 auto 8px}
.qrbox .lbl-name{font-weight:700;font-size:16px}
.qrbox .lbl-url{font-size:11px;overflow-wrap:anywhere;color:#5b6875}
.hide{display:none}
@media print{
  body *{visibility:hidden}
  .qrbox.printing,.qrbox.printing *{visibility:visible}
  .qrbox.printing{position:absolute;left:0;top:0;width:70mm;border:0}
  .qrbox.printing .noprint{display:none}
}
</style>

<body>
<header>
  <div><div class="t" id="hdr-title">CatchTrace</div><div class="o" id="hdr-sub">Buying and processing</div></div>
  <div id="hdr-user"></div>
</header>
<main id="view"></main>
<script src="qrcode.js"></script>
<script>
(function () {
'use strict';
var SESSION_KEY = 'ct.admin.session';   // the office pages (administration, buying and processing) share one sign-in
var BATCH_TYPES = [['processing', 'Processed (gutted, filleted, smoked, frozen...)'], ['intake', 'Received and stored as it is'],
                   ['repack', 'Repacked'], ['merge', 'Lots mixed together']];
var DEST = [['own_outlet', 'Own shop or outlet'], ['retail_customer', 'Retail customer'], ['wholesale_customer', 'Wholesale customer'],
            ['processor', 'Another processor'], ['export', 'Export'], ['other', 'Other']];
var VERIF = { unverified: ['Not verified', 'wait'], community_verified: ['Community verified', 'ok'],
              document_verified: ['Document verified', 'ok'], officially_verified: ['Officially verified', 'ok'] };
var S = { cfg: null, session: null, ctx: null, orgs: [], org: null, tab: 'purchases', batchId: null, species: {}, orgNames: {},
          txns: [], catches: {}, batches: [], detail: null, draft: null, picked: {}, refusing: null, withdrawing: null,
          cids: {}, login: { mode: 'password', email: '' }, flash: null, busy: false, loading: false,
          supplies: [], sites: [], orgList: [], supplyForm: false, voiding: null };

// ------------------------------------------------------------------- dom
// Everything shown comes through text nodes; no markup is built from data.
function h(tag, attrs) {
  var e = document.createElement(tag), k, i;
  for (k in (attrs || {})) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'text') e.textContent = v;
    else if (k === 'class') e.className = v;
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(e, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; }
  e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
}
function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
function $(sel) { return document.querySelector(sel); }
function kg(n) { return String(Math.round(Number(n) * 1000) / 1000) + ' kg'; }
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? Math.round(n * 1000) / 1000 : NaN; }
function when(ts) {
  try { return new Date(ts).toLocaleString('en-GB', { timeZone: 'Africa/Nairobi', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return String(ts); }
}
function label(list, code) { for (var i = 0; i < list.length; i++) if (list[i][0] === code) return list[i][1]; return String(code).replace(/_/g, ' '); }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = new Uint8Array(16); crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var x = Array.prototype.map.call(b, function (n) { return ('0' + n.toString(16)).slice(-2); }).join('');
  return x.slice(0, 8) + '-' + x.slice(8, 12) + '-' + x.slice(12, 16) + '-' + x.slice(16, 20) + '-' + x.slice(20);
}
// One id per distinct request, kept until a save succeeds: sending the same
// request again after a lost answer is recognised by the server and not saved
// twice, while a request with different figures gets a new id.
function cid(key, payload) { var k = key + '|' + JSON.stringify(payload); if (!S.cids[k]) S.cids[k] = uuid(); return S.cids[k]; }
// Safe only for requests the server recognises as repeats.
function retry(make, n) {
  return make().then(null, function (e) {
    if (!(e instanceof NetErr) || n <= 0) throw e;
    return new Promise(function (r) { setTimeout(r, 800); }).then(function () { return retry(make, n - 1); });
  });
}

// ------------------------------------------------------------------- api
function NetErr(m) { this.name = 'NetErr'; this.message = m || 'No connection'; }
function AuthErr(m) { this.name = 'AuthErr'; this.message = m || 'Please sign in again'; }
function ApiErr(m, code, status) { this.name = 'ApiErr'; this.message = m; this.code = code; this.status = status; }
function raw(path, opts, timeoutMs) {
  var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, timeoutMs || 20000);
  opts = opts || {}; opts.signal = ctl.signal;
  return fetch(S.cfg.url + path, opts).then(function (r) { clearTimeout(timer); return r; },
    function () { clearTimeout(timer); throw new NetErr(); });
}
function saveSession(s) { S.session = s; if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }
function signIn(email, password) {
  return raw('/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: S.cfg.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email.trim().toLowerCase(), password: password }) }).then(function (r) {
    return r.json().then(null, function () { throw new NetErr('Connection lost'); }).then(function (j) {
      if (!r.ok) { if (r.status >= 500) throw new NetErr(); throw new ApiErr(j.error_description || j.msg || 'Sign-in failed', j.error, r.status); }
      saveSession(j); return j;
    });
  });
}
// Sign-in with a one-time code sent by email (no password). An address with no
// account is answered exactly like one with an account, so the form cannot be
// used to find out who is registered.
function requestCode(email) {
  return raw('/auth/v1/otp', { method: 'POST', headers: { apikey: S.cfg.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email.trim().toLowerCase(), create_user: false }) }).then(function (r) {
    if (r.ok) return true;
    return r.json().then(null, function () { return {}; }).then(function (j) {
      if (r.status >= 500) throw new NetErr();
      if (j.error_code === 'otp_disabled' || /signups not allowed/i.test(j.msg || '')) return true;
      if (r.status === 429) throw new ApiErr('A code was sent a moment ago. Wait a minute before asking for another.', j.error_code, 429);
      throw new ApiErr('The code could not be sent (' + (j.msg || j.error_description || 'status ' + r.status) + ').', j.error_code, r.status);
    });
  });
}
function verifyCode(email, code) {
  return raw('/auth/v1/verify', { method: 'POST', headers: { apikey: S.cfg.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'email', email: email.trim().toLowerCase(), token: code }) }).then(function (r) {
    return r.json().then(null, function () { throw new NetErr('Connection lost'); }).then(function (j) {
      if (!r.ok) { if (r.status >= 500) throw new NetErr(); throw new ApiErr('That code is wrong or has expired. Check it, or ask for a new one.', j.error_code, r.status); }
      if (!j.access_token) throw new ApiErr('Sign-in did not complete. Ask for a new code.', 'no_session', r.status);
      saveSession(j); return j;
    });
  });
}
var refreshing = null;
function refreshToken() {
  if (refreshing) return refreshing;
  refreshing = raw('/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: S.cfg.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: S.session.refresh_token }) }).then(function (r) {
    return r.json().then(null, function () { throw new NetErr('Connection lost'); }).then(function (j) {
      if (!r.ok) { if (r.status >= 500 || r.status === 429) throw new NetErr(); throw new AuthErr(); }
      saveSession(j); return j;
    });
  }).then(function (j) { refreshing = null; return j; }, function (e) { refreshing = null; throw e; });
  return refreshing;
}
function authed(path, opts, retried) {
  if (!S.session) return Promise.reject(new AuthErr());
  var pre = (S.session.expires_at && S.session.expires_at - Date.now() / 1000 < 60) ? refreshToken() : Promise.resolve();
  return pre.then(function () {
    opts.headers = Object.assign({}, opts.headers, { apikey: S.cfg.key, Authorization: 'Bearer ' + S.session.access_token });
    return raw(path, opts);
  }).then(function (r) {
    if (r.status === 401 && !retried) return refreshToken().then(function () { return authed(path, opts, true); });
    return r.text().then(null, function () { throw new NetErr('Connection lost'); }).then(function (t) {
      var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { /* not json */ }
      if (r.ok) return j;
      if (r.status === 401) throw new AuthErr();
      // Go by the database's own error code, not the HTTP status (the hosted
      // gateway answers "not found" with status 500).
      var msg = String((j && j.message) || 'Request refused').replace(/^catchtrace:\s*/, '');
      var sqlstate = j && typeof j.code === 'string' && /^[0-9A-Z]{5}$/.test(j.code) ? j.code : null;
      if (sqlstate && !/^(08|40|53|55|57|58|XX)/.test(sqlstate)) throw new ApiErr(msg, sqlstate, r.status);
      if (r.status >= 500 || r.status === 408 || r.status === 429) throw new NetErr('Server busy');
      throw new ApiErr(msg, j && j.code, r.status);
    });
  });
}
function rpc(fn, args) { return authed('/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Content-Profile': 'catchtrace' }, body: JSON.stringify(args || {}) }); }
function get(table, query) { return authed('/rest/v1/' + table + '?' + query, { method: 'GET', headers: { 'Accept-Profile': 'catchtrace' } }); }

// ------------------------------------------------------------------ data
function loadBase() {
  return Promise.all([
    rpc('my_context'),
    get('species', 'select=id,common_name_en,common_name_sw'),
    get('organizations', 'select=id,name,org_type,home_landing_site_id,status'),
    get('landing_sites', 'select=id,name,status&order=name.asc')
  ]).then(function (r) {
    S.orgList = r[2] || []; S.sites = r[3] || [];
    S.ctx = r[0]; S.species = {}; S.orgNames = {};
    (r[1] || []).forEach(function (x) { S.species[x.id] = x; });
    (r[2] || []).forEach(function (x) { S.orgNames[x.id] = x.name; });
    var seen = {};
    S.orgs = (S.ctx.memberships || []).filter(function (m) {
      if ((m.role !== 'clerk' && m.role !== 'org_admin') || seen[m.organization_id]) return false;
      seen[m.organization_id] = true; return true;
    });
    var saved = localStorage.getItem('ct.com.org');
    var pick = S.orgs.filter(function (m) { return m.organization_id === saved; })[0]
            || S.orgs.filter(function (m) { return m.org_type === 'buyer' || m.org_type === 'processor'; })[0] || S.orgs[0];
    S.org = pick ? pick.organization_id : null;
  });
}
function loadOrg() {
  if (!S.org) { S.txns = []; S.batches = []; S.catches = {}; S.supplies = []; return Promise.resolve(); }
  return Promise.all([
    get('transactions', 'select=id,txn_ref,catch_record_id,seller_organization_id,quantity_kg,unit_price_kes,total_kes,status,consumed_kg,transacted_at&buyer_organization_id=eq.' + S.org + '&status=neq.cancelled&order=transacted_at.desc'),
    get('processing_batches', 'select=id,batch_ref,batch_type,product_form,product_name,species_id,input_kg,added_kg,output_kg,byproduct_kg,loss_kg,consumed_kg,status,processed_at,packaged_at&organization_id=eq.' + S.org + '&order=processed_at.desc'),
    get('supplier_supplies', 'select=id,supply_ref,supplier_organization_id,landing_site_id,species_id,weight_kg,received_at,batch_id,status,void_reason&organization_id=eq.' + S.org + '&order=received_at.desc')
  ]).then(function (r) {
    S.txns = r[0] || []; S.batches = r[1] || []; S.supplies = r[2] || [];
    return loadCatches(S.txns.map(function (t) { return t.catch_record_id; }));
  });
}
function loadCatches(ids) {
  var need = ids.filter(function (id, i) { return id && !S.catches[id] && ids.indexOf(id) === i; });
  if (!need.length) return Promise.resolve();
  return get('catch_records', 'select=id,catch_ref,species_id,verification_level&id=in.(' + need.join(',') + ')')
    .then(function (rows) { (rows || []).forEach(function (c) { S.catches[c.id] = c; }); });
}
function loadDetail(id) {
  return Promise.all([
    get('batch_catch_links', 'select=id,catch_record_id,transaction_id,quantity_kg&batch_id=eq.' + id),
    get('distribution_records', 'select=id,dist_ref,quantity_kg,destination_type,destination_label,external_ref,status,dispatched_at,delivered_at&batch_id=eq.' + id + '&order=dispatched_at.desc'),
    get('public_traceability_tokens', 'select=id,token,status,issued_at&batch_id=eq.' + id + '&order=issued_at.asc'),
    rpc('public_token_stats', { p_batch_id: id }),
    rpc('trace_backward', { p_batch_id: id })
  ]).then(function (r) {
    var scans = {}; (r[3] || []).forEach(function (s) { scans[s.token_id] = s.scans; });
    S.detail = { id: id, links: r[0] || [], dists: r[1] || [], tokens: r[2] || [], scans: scans, trace: r[4] || {} };
    return loadCatches(S.detail.links.map(function (l) { return l.catch_record_id; }));
  });
}
function start() {
  S.loading = true; render();
  return loadBase().then(loadOrg).then(function () { S.loading = false; render(); }, function (e) { S.loading = false; fail(e, true); });
}
function batch() { return S.batches.filter(function (b) { return b.id === S.batchId; })[0]; }
function spName(id) { var s = S.species[id]; return s ? s.common_name_en + (s.common_name_sw ? ' / ' + s.common_name_sw : '') : 'Species not shown'; }
function left(t) { return Math.round((Number(t.quantity_kg) - Number(t.consumed_kg)) * 1000) / 1000; }

// --------------------------------------------------------------- actions
function setFlash(kind, text) {
  S.flash = kind ? [kind, text] : null;
  var b = $('#flash-box'); if (!b) return;
  clear(b);
  if (S.flash) { add(b, h('div', { 'class': 'msg ' + kind, id: 'flash', text: text })); if (b.scrollIntoView) b.scrollIntoView({ block: 'nearest' }); }
}
function setBusy(on) {
  S.busy = on;
  Array.prototype.forEach.call(document.querySelectorAll('button[data-busy]'), function (btn) {
    btn.disabled = on; btn.textContent = on ? btn.getAttribute('data-busy') : btn.getAttribute('data-label');
  });
}
function fail(e, redraw) {
  S.busy = false;
  if (e instanceof AuthErr) { saveSession(null); S.ctx = null; S.flash = ['err', 'Your sign-in has ended. Sign in again.']; return render(); }
  var text = e instanceof NetErr ? 'Connection problem. Press the button again - the same request is never saved twice.'
           : (e && e.message) || 'Something went wrong.';
  if (redraw) { S.flash = ['err', text]; return render(); }
  setBusy(false); setFlash('err', text);
}
function reload() { return loadOrg().then(function () { return S.batchId ? loadDetail(S.batchId) : null; }); }
// Run a write, then reload what it changed and redraw with a confirmation.
// make() sends the request; it is sent again up to twice if the connection
// drops, unless once is true (for the one request that is not repeat-safe).
function act(make, okText, after, once) {
  if (S.busy) return;
  setFlash(null); setBusy(true);
  (once ? make() : retry(make, 2)).then(function (res) {
    S.cids = {};
    if (after) after(res);
    return reload();
  }).then(function () { S.busy = false; S.flash = ['ok', okText]; render(); }, function (e) {
    if (once && e instanceof NetErr) {
      // Not known whether it was saved: show the true state rather than invite a second press.
      return reload().then(function () { S.busy = false; S.flash = ['err', 'Connection problem. Look below to see whether it was saved before trying again.']; render(); }, function () { fail(e); });
    }
    fail(e);
  });
}
function afterSignIn() { S.busy = false; S.login = { mode: 'password', email: '' }; return start(); }
function doSignIn(ev) {
  ev.preventDefault();
  if (S.busy) return;
  setFlash(null); setBusy(true);
  signIn($('#email').value, $('#password').value).then(afterSignIn,
    function (e) { setBusy(false); setFlash('err', e instanceof NetErr ? 'No connection. Try again.' : 'Sign-in failed. Check the email and password.'); });
}
function doSignOut() {
  saveSession(null); S.login = { mode: 'password', email: '' };
  S.ctx = null; S.orgs = []; S.org = null; S.txns = []; S.batches = []; S.catches = {}; S.detail = null; S.draft = null; S.picked = {};
  S.batchId = null; S.cids = {}; S.flash = null; S.tab = 'purchases'; S.supplies = []; S.supplyForm = false; S.voiding = null; render();
}
function go(tab) { S.tab = tab; S.batchId = null; S.detail = null; S.draft = null; S.refusing = null; S.withdrawing = null; S.supplyForm = false; S.voiding = null; S.flash = null; render(); }
function openBatch(id, keepFlash) {
  S.tab = 'batches'; S.batchId = id; S.detail = null; S.draft = null; S.withdrawing = null; S.voiding = null; if (!keepFlash) S.flash = null; render();
  loadDetail(id).then(function () { if (S.batchId === id) render(); }, function (e) { fail(e, true); });
}
function doConfirm(t) { act(function () { return rpc('confirm_sale', { p_transaction_id: t.id }); }, 'Purchase ' + t.txn_ref + ' confirmed. It is now in stock.'); }
function doRefuse(ev, t) {
  ev.preventDefault();
  var reason = $('#refuse-reason').value.trim();
  if (reason.length < 3) return setFlash('err', 'Say briefly why the purchase is refused.');
  act(function () { return rpc('cancel_sale', { p_transaction_id: t.id, p_reason: reason }); }, 'Purchase ' + t.txn_ref + ' refused.', function () { S.refusing = null; }, true);
}
function startDraft() {
  var src = S.txns.filter(function (t) { return S.picked[t.id] && t.status === 'confirmed' && left(t) > 0; });
  if (!src.length) return setFlash('err', 'Tick at least one purchase first.');
  S.draft = { sources: src.map(function (t) { return { kind: 'transaction', id: t.id }; }) }; S.flash = null; render();
}
// What a source of a new batch is, and how much of it is left.
function draftSource(x) {
  if (x.kind === 'batch') {
    var b = S.batches.filter(function (y) { return y.id === x.id; })[0];
    return { ref: b.batch_ref, max: Math.round((Number(b.output_kg) - Number(b.consumed_kg)) * 1000) / 1000, species: b.species_id,
             node: h('div', {}, h('div', { 'class': 'name', text: b.product_name || b.product_form }), h('span', { 'class': 'ref', text: b.batch_ref })) };

      h('div', { 'class': 'muted noprint', text: 'Scanned ' + (S.detail.scans[k.id] || 0) + ' times - created ' + when(k.issued_at) }));
    add(box, h('div', { 'class': 'actions noprint' },
      h('button', { type: 'button', 'class': 'act-print', text: 'Print label', onclick: function () { doPrint(box); } }),
      btn(null, S.withdrawing === k.id ? 'Tap again to withdraw' : 'Withdraw code', 'Saving...', 'danger act-withdraw', function () { doWithdraw(k); })));
    return box;
  });
  return h('div', { 'class': 'card', id: 'qr' }, h('h3', { text: 'QR code for the pack' }),
    h('p', { 'class': 'muted', text: 'The public page shows the species, landing site, dates, who packed it and how far each catch is verified. It never shows weights, prices, fishers or vessels.' }),
    boxes,
    withdrawn ? h('div', { 'class': 'muted', text: withdrawn + ' earlier code' + (withdrawn === 1 ? ' has' : 's have') + ' been withdrawn.' }) : null,
    active.length ? null : h('div', { 'class': 'actions' }, btn('qr-issue', 'Create QR code', 'Saving...', '', doIssue)));
}
function viewBatch() {
  var b = batch();
  var back = h('button', { 'class': 'sec small', id: 'btn-back', text: 'Back to batches', onclick: function () { go('batches'); } });
  if (!b) return [back, flash(), h('div', { 'class': 'card muted', text: 'Batch not found.' })];
  var closed = b.status === 'closed', stock = closed ? Math.round((Number(b.output_kg) - Number(b.consumed_kg)) * 1000) / 1000 : 0;
  var sup = supplyOf(b), voided = !!sup && sup.status === 'void';
  var out = [back, h('h2', { text: (b.product_name || b.product_form) + ' - ' + b.batch_ref }), flash(),
    h('div', { 'class': 'card', id: 'batch-summary' },
      h('div', {}, h('span', { 'class': 'badge ' + (closed ? 'ok' : 'wait'), text: closed ? 'Closed' : 'Open' }), h('span', { 'class': 'badge', text: label(BATCH_TYPES, b.batch_type) })),
      h('div', { 'class': 'muted', text: 'Product: ' + b.product_form + ' - started ' + when(b.processed_at) }),
      h('div', { text: 'Went in: ' + kg(b.input_kg) + (Number(b.added_kg) ? ' plus ' + kg(b.added_kg) + ' added' : '') }),
      closed ? h('div', { text: 'Packed: ' + kg(b.output_kg) + ' - by-products: ' + kg(b.byproduct_kg) + ' - loss: ' + kg(b.loss_kg) }) : null,
      closed ? h('div', { 'class': 'big-num', id: 'stock-left', text: kg(stock) + ' left in stock' }) : null,
      voided ? h('div', { 'class': 'msg err', id: 'voided', style: 'margin:10px 0 0', text: 'This supply was withdrawn: ' + (sup.void_reason || 'no reason given') + '. It stays on record and cannot be used.' }) : null,
      closed && stock > 0 && !voided ? h('div', { 'class': 'actions' }, h('button', { type: 'button', 'class': 'sec', id: 'btn-further', text: 'Process this stock further',
        onclick: function () { S.draft = { sources: [{ kind: 'batch', id: b.id }] }; S.batchId = null; S.detail = null; S.tab = 'purchases'; S.flash = null; render(); } })) : null)];
  if (!S.detail || S.detail.id !== b.id) return out.concat([h('div', { 'class': 'card muted', text: 'Loading...' })]);
  var tr = S.detail.trace || {}, supSrc = tr.source_supplies || [], catchSrc = tr.source_catches || [];
  var srcNodes = S.detail.links.length ? S.detail.links.map(function (l) {
    return h('div', { 'class': 'item' }, catchLine(S.catches[l.catch_record_id]), h('div', { 'class': 'muted', text: kg(l.quantity_kg) + ' of this catch' }));
  }) : catchSrc.map(function (c) {
    return h('div', { 'class': 'item' }, h('div', { 'class': 'name', text: c.species + (c.species_sw ? ' / ' + c.species_sw : '') }), h('span', { 'class': 'ref', text: c.catch_ref + ' ' }),
      h('span', { 'class': 'badge', text: (c.verification && c.verification.label) || 'Not yet verified' }), h('div', { 'class': 'muted', text: 'Landed at ' + c.landing_site + ', ' + c.county }));
  });
  srcNodes = srcNodes.concat(supSrc.map(function (u) {
    return h('div', { 'class': 'item supply-src' },
      h('div', { 'class': 'name', text: u.species + (u.species_sw ? ' / ' + u.species_sw : '') }),
      h('span', { 'class': 'ref', text: u.supply_ref + ' ' }), h('span', { 'class': 'badge wait', text: 'Not verified' }),
      h('div', { text: 'Bought from ' + u.supplier + ' (' + supplierKind(u.supplier_type) + ')' }),
      h('div', { 'class': 'muted', text: kg(u.weight_kg) + ' received ' + when(u.received_at) + ' - tied to landing site ' + u.landing_site + ', ' + u.county +
        (u.document_ref ? ' - delivery note ' + u.document_ref : '') + (u.declared_origin ? ' - the supplier says: ' + u.declared_origin : '') }),
      h('div', { 'class': 'muted', text: 'The vessel and the landing are not on record.' }));
  }));
  out.push(h('div', { 'class': 'card', id: 'sources' }, h('h3', { text: 'Where it came from' }),
    h('div', { 'class': 'list' }, srcNodes.length ? srcNodes : h('div', { 'class': 'muted', text: voided ? 'Withdrawn supply.' : 'No source is on record.' }))));
  if (voided) return out;
  if (sup && closed && Number(b.consumed_kg) === 0 && !S.detail.tokens.some(function (k) { return k.status === 'active'; })) {
    out.push(S.voiding === sup.id
      ? h('form', { 'class': 'card', id: 'void-form', onsubmit: function (ev) { doVoid(ev, sup); } },
          field('Why is this supply being withdrawn?', h('input', { id: 'void-reason', maxlength: '200', placeholder: 'For example: entered twice' })),
          h('div', { 'class': 'actions' }, btn('void-go', 'Withdraw this supply', 'Saving...', 'danger', null, 'submit'),
            h('button', { type: 'button', 'class': 'sec', text: 'Back', onclick: function () { S.voiding = null; S.flash = null; render(); } })))
      : h('div', { 'class': 'card' }, h('button', { type: 'button', 'class': 'danger', id: 'btn-void', style: 'width:100%', text: 'Entered by mistake? Withdraw this supply',
          onclick: function () { S.voiding = sup.id; S.flash = null; render(); } })));
  }
  if (!closed) {
    out.push(h('form', { 'class': 'card', id: 'close-form', onsubmit: doClose, oninput: paintLoss },
      h('h3', { text: 'Close the batch' }),
      h('p', { 'class': 'muted', text: 'Weigh what was packed. What went in must equal what came out plus by-products plus loss.' }),
      h('div', { 'class': 'grid2' },
        h('div', {}, field('Packed product, kg', h('input', { id: 'cl-out', inputmode: 'decimal' }))),
        h('div', {}, field('Added (ice glaze, salt), kg - optional', h('input', { id: 'cl-add', inputmode: 'decimal' })))),
      h('div', { 'class': 'grid2' },
        h('div', {}, field('By-product kept, kg - optional', h('input', { id: 'cl-by', inputmode: 'decimal' }))),
        h('div', {}, field('What the by-product is', h('input', { id: 'cl-byform', maxlength: '80', placeholder: 'For example: Frames' })))),
      h('div', { 'class': 'msg info', id: 'cl-loss', style: 'margin-top:10px', text: 'Enter the packed weight to see the loss.' }),
      h('div', { 'class': 'actions' }, btn('cl-save', 'Close batch', 'Saving...', '', null, 'submit'))));
    return out;
  }
  if (stock > 0) {
    out.push(h('form', { 'class': 'card', id: 'dispatch-form', onsubmit: doDispatch },
      h('h3', { text: 'Send out stock' }),
      h('div', { 'class': 'grid2' },
        h('div', {}, field('Weight, kg (up to ' + kg(stock) + ')', h('input', { id: 'dp-kg', inputmode: 'decimal' }))),
        h('div', {}, field('Going to', sel('dp-type', DEST, 'own_outlet')))),
      h('div', { 'class': 'grid2' },
        h('div', {}, field('Name of the place or customer', h('input', { id: 'dp-label', maxlength: '120' }))),
        h('div', {}, field('Order or invoice number (optional)', h('input', { id: 'dp-ref', maxlength: '60' })))),
      h('div', { 'class': 'actions' }, btn('dp-save', 'Record dispatch', 'Saving...', '', null, 'submit'))));
  }
  out.push(h('div', { 'class': 'card', id: 'dispatches' }, h('h3', { text: 'Sent out' }),
    h('div', { 'class': 'list' }, S.detail.dists.length ? S.detail.dists.map(function (d) {
      var done = d.status === 'delivered';
      return h('div', { 'class': 'item', 'data-dist': d.dist_ref },
        h('div', { 'class': 'row' },
          h('div', {},
            h('div', {}, h('strong', { text: kg(d.quantity_kg) }), ' to ' + (d.destination_label || label(DEST, d.destination_type)) + ' '),
            h('div', { 'class': 'muted', text: d.dist_ref + ' - ' + label(DEST, d.destination_type) + (d.external_ref ? ' - order ' + d.external_ref : '') + ' - ' + when(d.dispatched_at) }),
            h('span', { 'class': 'badge ' + (done ? 'ok' : 'wait'), text: done ? 'Delivered ' + when(d.delivered_at) : 'On its way' })),
          done ? null : btn(null, 'Mark delivered', 'Saving...', 'sec small act-delivered', function () { doDelivered(d); })));
    }) : h('div', { 'class': 'muted', text: 'Nothing has been sent out from this batch.' }))));
  out.push(qrSection(b));
  return out;
}
function render() {
  var v = $('#view'), u = $('#hdr-user');
  clear(v); clear(u);
  $('#hdr-title').textContent = 'CatchTrace' + (S.cfg && S.cfg.env !== 'production' ? ' - ' + String(S.cfg.env || 'test').toUpperCase() : '');
  if (!S.session) { $('#hdr-sub').textContent = 'Buying and processing'; add(v, viewLogin()); return; }
  add(u, h('button', { id: 'btn-signout', text: 'Sign out', onclick: doSignOut }));
  var me = S.orgs.filter(function (m) { return m.organization_id === S.org; })[0];
  $('#hdr-sub').textContent = me ? me.organization : 'Buying and processing';
  if (S.loading && !S.ctx) { add(v, h('div', { 'class': 'card muted', text: 'Loading...' })); return; }
  if (!S.org) { add(v, [flash(), h('div', { 'class': 'msg info', id: 'no-role', text: 'This account is not a clerk or administrator of any organisation, so there is nothing to buy or process here.' })]); return; }
  add(v, [orgPicker(), S.batchId ? null : tabs()]);
  if (S.loading) { add(v, h('div', { 'class': 'card muted', text: 'Loading...' })); return; }
  add(v, S.batchId ? viewBatch() : S.tab === 'batches' ? viewBatches() : viewPurchases());
}

// ------------------------------------------------------------------ boot
fetch('config.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (c) {
  S.cfg = c;
  try { S.session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { S.session = null; }
  if (!S.session) return render();
  return start();
}).catch(function () { add($('#view'), h('div', { 'class': 'msg err', text: 'The page could not start. Check the connection and open it again.' })); });
window.__ctc = { S: S };   // read-only handle used by the automated tests
})();
</script>
